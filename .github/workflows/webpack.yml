name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
    paths: [ "dashboard/src/**", "package.json", "package-lock.json", "webpack.config.js", ".github/workflows/webpack.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "dashboard/src/**", "package.json", "package-lock.json", "webpack.config.js", ".github/workflows/webpack.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Build
      run: |
        npm ci
        npx webpack
